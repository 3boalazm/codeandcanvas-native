# Publishes dist/ to the `hostinger` branch ONLY after the mandatory gate,
# a human production approval, and (post-deploy) live-domain verification.
#
# A green Actions run alone is NOT evidence that the site answers: the
# verify-live job requests the real public domain and fails the workflow if any
# core route is missing, a 404, or an unresolved shared-head placeholder.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  gate:
    name: Gate — generate · check · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: 1 · Generate all pages
        run: npm run generate

      - name: 2 · Source consistency, links, claims, OG assets
        run: npm run check

      - name: 3 · Playwright + accessibility matrix
        run: npm test

      - name: 4 · First-party API / CRM / booking smoke test
        run: npm run verify:api

      - name: 5 · Production build
        run: npm run build

      # A post-deploy verification is only meaningful if the artifact it checks
      # is complete. Serve dist/ with production semantics and verify it here,
      # before anything is published: a truncated dist/ must fail the gate, not
      # the live domain an hour later.
      - name: 6 · Verify the built artifact (before deploying it)
        run: |
          node server/static.mjs &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break || sleep 1; done
          CC_BASE_URL=http://127.0.0.1:8080 node scripts/verify-live.mjs

      - name: Upload dist for deployment
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  deploy:
    name: Deploy (requires production approval)
    needs: gate
    runs-on: ubuntu-latest
    # The owner must configure this Environment with required reviewers.
    # Without that protection rule the gate alone does not constitute approval.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish dist/ to the hostinger branch
        run: |
          cd dist
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" hostinger

  verify-live:
    name: Verify the LIVE domain (not just this build)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the host to pick up the new branch
        run: sleep 45

      - name: Request every core route on https://codeandcanvas.net
        run: npm run verify:live

      # If the live check fails, publish the per-route report as an annotation so
      # the failure names the route. Job logs are not always retrievable; the
      # check-runs API always is.
      - name: Publish the live report on failure
        if: failure()
        run: |
          {
            echo "### Live domain verification failed"
            echo ''
            echo '```'
            npm run verify:live 2>&1 | tail -40 || true
            echo '```'
          } | sed 's/%/%25/g; s/\r//g' > report.md
          printf '::error file=.github/workflows/deploy-hostinger.yml,line=%s::%s\n' "$(grep -n 'npm run verify:live' .github/workflows/deploy-hostinger.yml | head -1 | cut -d: -f1)" "$(grep -E '✗|routes answered' report.md | head -12 | tr '\n' ' ' | cut -c1-900)"

