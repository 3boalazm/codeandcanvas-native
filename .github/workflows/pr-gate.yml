# Mandatory publish gate on pull requests. No deployment is possible from here;
# merging is blocked by the repository's required status check "Gate".
name: PR Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate — generate · check · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: 1 · Generate all pages (including Arabic twins)
        run: npm run generate

      - name: 2 · Source consistency, links, claims, OG assets
        run: npm run check

      - name: 3 · Playwright + accessibility matrix
        run: npm test

      - name: 4 · First-party API / CRM / booking smoke test
        run: npm run verify:api

      - name: 5 · Production build
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-preview
          path: dist/
          retention-days: 7

      - name: Upload test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
